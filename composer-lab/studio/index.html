<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Griff Studio</title>
<style>
  :root {
    --bg: #121417;
    --panel: #1b1f24;
    --panel2: #242a31;
    --border: #323a44;
    --text: #eef2f6;
    --muted: #98a4b3;
    --accent: #4ea1ff;
    --accent-dim: #254b75;
    --warn: #e09f3e;
    --ok: #52b788;
    --err: #e05a67;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
  }
  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: 100vh;
  }
  aside {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  main {
    padding: 20px;
    max-width: 1040px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  h1 { margin: 0; font-size: 1.25rem; }
  h2 { margin: 0 0 10px 0; font-size: 1rem; color: var(--muted); font-weight: 600; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button, .btn {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.9rem;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  button:hover, .btn:hover { border-color: var(--accent); }
  button.primary { background: var(--accent-dim); border-color: var(--accent); }
  button.active { background: var(--accent); color: #08121e; border-color: var(--accent); font-weight: 600; }
  button.locked { border-color: var(--warn); color: var(--warn); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  input[type="number"] {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 9px;
    width: 110px;
  }
  .piece-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow-y: auto;
    max-height: calc(100vh - 180px);
  }
  .piece-item {
    text-align: left;
    padding: 10px;
    border-radius: 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    cursor: pointer;
    color: var(--text);
    display: block;
    width: 100%;
  }
  .piece-item.selected { border-color: var(--accent); background: #162231; }
  .piece-meta { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .busy {
    display: none;
    padding: 4px 10px;
    border-radius: 999px;
    background: #3a2d12;
    color: var(--warn);
    border: 1px solid var(--warn);
    font-size: 0.85rem;
  }
  .busy.show { display: inline-flex; align-items: center; gap: 6px; }
  audio { width: 100%; margin-top: 6px; }
  .timeline {
    display: flex;
    gap: 4px;
    margin-top: 10px;
    width: 100%;
  }
  .sec-block {
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 6px;
    padding: 8px 6px;
    color: #fff;
    cursor: pointer;
    min-width: 56px;
    text-align: left;
    overflow: hidden;
    transition: transform 0.1s ease, outline 0.1s ease;
  }
  .timeline .sec-block { -webkit-touch-callout: none; user-select: none; }
  .mark-bar { margin-top: 10px; }
  .mark-track { position: relative; height: 24px; margin-top: 6px; border-top: 1px solid var(--border); }
  .mark-flag {
    position: absolute;
    top: 3px;
    width: 14px;
    height: 20px;
    min-width: 0;
    margin-left: -2px;
    padding: 0;
    border: none;
    border-left: 2px solid var(--text);
    border-radius: 0 4px 4px 0;
    background: var(--warn);
  }
  .mark-flag.stale { background: var(--muted); opacity: 0.5; }
  .marks-box { margin-top: 12px; }
  .marks-hint { font-size: 0.78rem; color: var(--muted); margin: 6px 0; }
  .marks-title { margin: 0 0 8px 0; font-size: 0.95rem; color: var(--muted); font-weight: 600; }
  .mark-list { display: flex; flex-direction: column; gap: 6px; }
  .mark-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .mark-row .mark-open { flex: 1 1 200px; justify-content: flex-start; text-align: left; }
  .mark-row.stale .mark-open { opacity: 0.5; }
  .mark-editor {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    padding: 8px;
    margin-bottom: 8px;
    border: 1px solid var(--warn);
    border-radius: 6px;
  }
  .mark-editor input[type="text"] {
    flex: 1 1 180px;
    min-width: 0;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 9px;
  }
  .sec-block:hover { transform: translateY(-1px); outline: 1px solid #fff; }
  .sec-block.playing { outline: 2px solid #fff; }
  .sec-block .name { font-size: 0.82rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sec-block .name-short { display: none; }
  .sec-block .time { font-size: 0.72rem; opacity: 0.9; }
  .sec-intro { background: #2d4f6c; }
  .sec-A { background: #2d6a4f; }
  .sec-A2 { background: #3b7a57; }
  .sec-B { background: #7f4f24; }
  .sec-A3 { background: #8c2f39; }
  .sec-end { background: #495057; }
  .sections-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr));
    gap: 12px;
  }
  .sec-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .layer-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .layer-row .reroll-btn { flex: 1; justify-content: space-between; }
  .salt-badge {
    font-size: 0.75rem;
    color: var(--muted);
    background: var(--bg);
    padding: 1px 6px;
    border-radius: 999px;
  }
  .options-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
  }
  .slider-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 0.88rem;
  }
  .slider-head { display: flex; justify-content: space-between; color: var(--muted); }
  .option-hint, .params-note, .advanced-note { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  .params-note, .advanced-note { margin: 0 0 10px 0; }
  .salt-badge[hidden] { display: none; }
  .btn-hint { font-weight: 400; color: var(--muted); }
  .field-label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
  .load-banner {
    background: #36171c;
    border: 1px solid var(--err);
    color: #f8b4bb;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 0.82rem;
    overflow-wrap: anywhere;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .load-banner[hidden] { display: none; }
  .banner-retry { min-height: 40px; padding: 6px 10px; font-size: 0.8rem; }
  .status-chip {
    position: fixed;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    z-index: 20;
    padding: 8px 16px;
    border-radius: 999px;
    background: #3a2d12;
    color: var(--warn);
    border: 1px solid var(--warn);
    font-size: 0.9rem;
    pointer-events: none;
  }
  .status-chip:empty { display: none; }
  .slider-dim { opacity: 0.55; }
  .advanced-options { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px; }
  .advanced-options summary { cursor: pointer; color: var(--muted); font-size: 0.9rem; font-weight: 600; margin-bottom: 10px; }
  input[type="range"] { width: 100%; }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  @media (max-width: 520px) {
    .sec-block { min-width: 48px; flex: 1 1 48px; padding: 8px 4px; }
    .sec-block .name-full { display: none; }
    .sec-block .name-short { display: inline; }
    .sec-block .time { font-size: 0.65rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn-hint { display: none; }
  }
  @media (max-width: 780px) {
    .layout { grid-template-columns: 1fr; }
    aside { border-right: none; border-bottom: 1px solid var(--border); }
    .piece-list { max-height: 220px; }
    .timeline { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="header-bar">
      <h1>Griff Studio</h1>
      <span id="busy" class="busy">Рендер...</span>
    </div>
    <div>
      <label class="field-label" for="seedInput">Номер пьесы (seed), необязательно</label>
      <div class="row">
        <button id="newBtn" class="primary">Новая пьеса</button>
        <input id="seedInput" type="number" placeholder="например, 801000">
      </div>
    </div>
    <div id="pieceList" class="piece-list"></div>
    <a class="btn" id="allMarksBtn" href="/api/marks.json" download>Скачать отметки всех пьес</a>
  </aside>
  <main id="workspace">
    <div id="errorBanner" class="load-banner" role="alert" hidden>
      <span id="errorText"></span>
      <button id="errorCloseBtn" class="banner-retry" aria-label="Закрыть сообщение об ошибке">Закрыть</button>
    </div>
    <div class="empty">Нажмите «Новая пьеса» или выберите готовую из списка.</div>
  </main>
</div>
<div id="statusChip" class="status-chip" role="status"></div>
<script>
const SHORT_SECTION_LABELS = { intro: "Вст.", A: "A", A2: "A2", B: "B", A3: "Кульм.", end: "Конц." };
const SLIDER_DEBOUNCE_MS = 600;
const LONG_PRESS_MS = 500;
const MARK_TEXT_MAX = 80;
const TEXT_INPUT_TYPES = ["", "text", "search", "number", "email", "url", "password", "tel"];
const LONG_PRESS_SLOP_PX = 10;
const MARK_GUITARS = [["lead", "Соло"], ["rhythm", "Ритм"], ["both", "Обе"]];
const MARK_GUITAR_LABELS = { lead: "соло", rhythm: "ритм", both: "обе" };
const MARK_HINT = "Отметьте место, где звучит не по-человечески: кнопка «Тут не так», клавиша M или Shift+клик по таймлайну. Музыку это не меняет.";
let pressTimer = null;
let pressStart = null;
let swallowClick = false;
const ERROR_BANNER_HTML = `<div id="errorBanner" class="load-banner" role="alert" hidden>
      <span id="errorText"></span>
      <button id="errorCloseBtn" class="banner-retry" aria-label="Закрыть сообщение об ошибке">Закрыть</button>
    </div>`;
const MODE_LABELS = {
  ionian: "мажор (ионийский)",
  aeolian: "минор (эолийский)",
  dorian: "дорийский",
  phrygian: "фригийский",
  lydian: "лидийский",
  mixolydian: "миксолидийский",
  locrian: "локрийский",
};
const modeLabel = (mode) => MODE_LABELS[mode] || mode;
const KEY_TONICS = ["E", "F#", "G", "A", "B", "C#", "D"];
const KEY_MODES = [
  ["ionian", "мажор"],
  ["dorian", "дорийский"],
  ["phrygian", "фригийский"],
  ["lydian", "лидийский"],
  ["mixolydian", "миксолидийский"],
  ["aeolian", "натуральный минор"],
  ["locrian", "локрийский"],
];
const state = { pieces: [], current: null, currentId: null, busyCount: 0, chipCount: 0, error: "", navSeq: 0, editSeq: 0, pendingSliders: [], markEdit: null, auditionEnd: null };

function setChip(delta) {
  state.chipCount = Math.max(0, state.chipCount + delta);
  document.getElementById("statusChip").textContent = state.chipCount > 0 ? "Пересчёт…" : "";
}

function paintError() {
  const banner = document.getElementById("errorBanner");
  banner.hidden = !state.error;
  document.getElementById("errorText").textContent = state.error;
  document.getElementById("errorCloseBtn").onclick = () => {
    state.error = "";
    paintError();
  };
}

function showError(err, pieceId) {
  let where = "";
  if (pieceId && pieceId !== state.currentId) {
    const p = state.pieces.find((x) => x.id === pieceId);
    where = ` (пьеса #${p ? p.seed : pieceId})`;
  }
  state.error = `Ошибка${where}: ${err && err.message ? err.message : err}`;
  paintError();
}

function dropPending(flush) {
  const i = state.pendingSliders.indexOf(flush);
  if (i >= 0) state.pendingSliders.splice(i, 1);
}

async function settlePending() {
  for (const flush of state.pendingSliders.splice(0)) await flush();
}

function setBusy(delta) {
  state.busyCount = Math.max(0, state.busyCount + delta);
  document.getElementById("busy").classList.toggle("show", state.busyCount > 0);
}

async function api(url, opts = {}) {
  setBusy(1);
  try {
    const res = await fetch(url, {
      headers: opts.body ? { "Content-Type": "application/json" } : {},
      ...opts,
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: res.statusText }));
      throw new Error(err.error || res.statusText);
    }
    return await res.json();
  } finally {
    setBusy(-1);
  }
}

function fmtSec(s) {
  return `${Number(s).toFixed(1)} с`;
}

function renderList() {
  const el = document.getElementById("pieceList");
  el.innerHTML = "";
  for (const p of state.pieces) {
    const btn = document.createElement("button");
    const selected = Boolean(state.current && state.current.id === p.id);
    btn.className = "piece-item" + (selected ? " selected" : "");
    if (selected) btn.setAttribute("aria-current", "true");
    btn.innerHTML = `<div><strong>#${p.seed}</strong> · ${p.meter} · ${p.key} ${modeLabel(p.mode)}</div>
      <div class="piece-meta">${p.tempo} BPM · ${p.length} с</div>`;
    btn.onclick = () => selectPiece(p.id);
    el.appendChild(btn);
  }
}

function renderWorkspace(preserveTime = null) {
  const main = document.getElementById("workspace");
  const d = state.current;
  if (!d) {
    main.innerHTML = ERROR_BANNER_HTML + '<div class="empty">Нажмите «Новая пьеса» или выберите готовую из списка.</div>';
    paintError();
    return;
  }

  state.auditionEnd = null;
  const audioUrl = `/api/piece/${encodeURIComponent(d.id)}/audio.mp3?t=${Date.now()}`;
  const total = Math.max(1, d.length);

  main.innerHTML = `${ERROR_BANNER_HTML}
    <div class="card">
      <div class="header-bar">
        <div>
          <strong>Пьеса #${d.seed}</strong> · ${d.meter} · ${d.key} ${modeLabel(d.mode)} · ${d.tempo} BPM · ${d.length} с
        </div>
        <div class="row">
          <button id="undoBtn"></button>
          <button id="redoBtn"></button>
          <a class="btn" href="/api/piece/${encodeURIComponent(d.id)}/piece.mid" download>Скачать MIDI</a>
          <a class="btn" href="/api/piece/${encodeURIComponent(d.id)}/piece.musicxml" download>Скачать табы (MusicXML)</a>
        </div>
      </div>
      <audio id="player" controls src="${audioUrl}"></audio>
      <div id="timeline" class="timeline"></div>
      <div class="row mark-bar">
        <button id="markBtn" title="Отметить место (клавиша M)" aria-keyshortcuts="M">Тут не так</button>
      </div>
      <div id="markTrack" class="mark-track"></div>
      <div class="marks-box">
        <div id="marksTitle" class="marks-title"></div>
        <div id="markEditorHost"></div>
        <div id="markList" class="mark-list"></div>
        <div id="marksHint" class="marks-hint"></div>
        <a class="btn" id="marksDlBtn" download>Скачать отметки</a>
      </div>
    </div>

    <div class="card">
      <h2>Вся пьеса</h2>
      <div class="row" id="wholeRow"></div>
    </div>

    <div class="card">
      <h2>Секции</h2>
      <div class="sections-grid" id="sectionsGrid"></div>
    </div>

    <div class="card">
      <h2>Параметры пьесы</h2>
      <div class="params-note">Параметры действуют на всю пьесу, в том числе на закреплённые секции.</div>
      <div class="options-grid" id="optionsGrid"></div>
      <details class="advanced-options">
        <summary>Дополнительно</summary>
        <div class="advanced-note">Эти параметры действуют только при следующей перегенерации ритм-гитары («Перегенерировать ритм-гитару» или «Перегенерировать всё незакреплённое»).</div>
        <div class="options-grid" id="advancedGrid"></div>
      </details>
    </div>
  `;

  paintError();
  const player = document.getElementById("player");
  if (preserveTime !== null) {
    player.addEventListener("loadedmetadata", () => {
      try { player.currentTime = Math.min(preserveTime, player.duration || preserveTime); } catch (_) {}
    }, { once: true });
  }

  const tl = document.getElementById("timeline");
  for (const s of d.sections) {
    const dur = Math.max(0.5, s.end_sec - s.start_sec);
    const blk = document.createElement("button");
    blk.className = `sec-block sec-${s.section}`;
    blk.style.flexGrow = String(dur / total);
    blk.dataset.start = String(s.start_sec);
    blk.dataset.end = String(s.end_sec);
    blk.title = s.label;
    blk.setAttribute("aria-label", `${s.label}, ${s.start_sec.toFixed(1)}–${s.end_sec.toFixed(1)} с`);
    const nameEl = document.createElement("div");
    nameEl.className = "name";
    const fullEl = document.createElement("span");
    fullEl.className = "name-full";
    fullEl.textContent = s.label;
    const shortEl = document.createElement("span");
    shortEl.className = "name-short";
    shortEl.textContent = SHORT_SECTION_LABELS[s.section] || s.label;
    nameEl.appendChild(fullEl);
    nameEl.appendChild(shortEl);
    const timeEl = document.createElement("div");
    timeEl.className = "time";
    timeEl.textContent = `${s.start_sec.toFixed(1)}–${s.end_sec.toFixed(1)} с`;
    blk.appendChild(nameEl);
    blk.appendChild(timeEl);
    blk.onclick = (ev) => {
      if (swallowClick) {
        swallowClick = false;
        return;
      }
      if (ev && ev.shiftKey) {
        addMark(timelineTime(blk, s, ev));
        return;
      }
      state.auditionEnd = null;
      player.currentTime = s.start_sec;
      player.play().catch(() => {});
    };
    blk.onpointerdown = (ev) => {
      swallowClick = false;
      clearTimeout(pressTimer);
      pressTimer = null;
      if (!ev || ev.pointerType !== "touch") return;
      pressStart = { x: ev.clientX, y: ev.clientY };
      pressTimer = setTimeout(() => {
        pressTimer = null;
        swallowClick = true;
        addMark(timelineTime(blk, s, ev));
      }, LONG_PRESS_MS);
    };
    blk.onpointermove = (ev) => {
      if (pressTimer && pressStart && Math.hypot(ev.clientX - pressStart.x, ev.clientY - pressStart.y) > LONG_PRESS_SLOP_PX) {
        clearTimeout(pressTimer);
        pressTimer = null;
      }
    };
    blk.onpointerup = () => {
      clearTimeout(pressTimer);
      pressTimer = null;
    };
    blk.onpointercancel = blk.onpointerup;
    blk.oncontextmenu = (ev) => {
      if (swallowClick || pressTimer) ev.preventDefault();
    };
    tl.appendChild(blk);
  }
  document.getElementById("markBtn").onclick = () => addMark(player.currentTime);
  document.getElementById("marksDlBtn").href = `/api/piece/${encodeURIComponent(d.id)}/marks.json`;
  document.getElementById("marksHint").textContent = MARK_HINT;
  renderMarks();
  player.addEventListener("pause", () => {
    state.auditionEnd = null;
  });
  player.addEventListener("timeupdate", () => {
    const t = player.currentTime;
    if (state.auditionEnd !== null && t >= state.auditionEnd) {
      state.auditionEnd = null;
      player.pause();
    }
    for (const blk of tl.children) {
      const a = Number(blk.dataset.start), b = Number(blk.dataset.end);
      blk.classList.toggle("playing", t >= a && t < b);
    }
  });

  function setupHistoryButton(btn, verb, enabled, label, action) {
    btn.textContent = verb;
    btn.title = enabled && label ? `${verb}: ${label}` : verb;
    if (enabled && label) {
      const hint = document.createElement("span");
      hint.className = "btn-hint";
      hint.textContent = `: ${label}`;
      btn.appendChild(hint);
    }
    btn.disabled = !enabled;
    btn.onclick = () => mutate(`/api/piece/${encodeURIComponent(d.id)}/${action}`, {}, d.id, btn);
  }
  setupHistoryButton(document.getElementById("undoBtn"), "Отменить", d.can_undo, d.undo_label, "undo");
  setupHistoryButton(document.getElementById("redoBtn"), "Вернуть", d.can_redo, d.redo_label, "redo");

  const wholeRow = document.getElementById("wholeRow");
  for (const l of d.whole_layers) {
    wholeRow.appendChild(makeLayerControl(d.id, l));
  }
  const allBtn = document.createElement("button");
  allBtn.className = "primary";
  allBtn.textContent = "Перегенерировать всё незакреплённое";
  allBtn.onclick = () => mutate(`/api/piece/${encodeURIComponent(d.id)}/reroll`, { layer: "all", section: "all" }, d.id, allBtn);
  wholeRow.appendChild(allBtn);

  function bindSliderCommit(inp, onMove, commit) {
    let timer = null;
    let dragging = false;
    let dirty = false;
    const cancel = () => {
      clearTimeout(timer);
      timer = null;
      dirty = false;
      dropPending(flush);
    };
    const flush = () => {
      clearTimeout(timer);
      timer = null;
      dropPending(flush);
      if (!dirty) return undefined;
      dirty = false;
      return commit();
    };
    inp.oninput = () => {
      dirty = true;
      if (!state.pendingSliders.includes(flush)) state.pendingSliders.push(flush);
      onMove();
      clearTimeout(timer);
      timer = dragging ? null : setTimeout(flush, SLIDER_DEBOUNCE_MS);
    };
    inp.onpointerdown = () => {
      dragging = true;
      clearTimeout(timer);
      timer = null;
    };
    inp.onpointerup = () => {
      dragging = false;
      flush();
    };
    inp.onpointercancel = inp.onpointerup;
    inp.onchange = () => {
      if (!dragging) return;
      dragging = false;
      flush();
    };
    return cancel;
  }

      inp,
      () => {

function markSummary(m) {
  const who = MARK_GUITAR_LABELS[m.guitar] || m.guitar;
  return `${m.bar}:${m.sixteenth} · ${who}${m.text ? ` · ${m.text}` : ""}${m.stale ? " (до изменения)" : ""}`;
}

function findMark(id) {
  return ((state.current && state.current.marks) || []).find((m) => m.id === id) || null;
}

async function markRequest(pieceId, action, body, onDone) {
  let res;
  try {
    res = await api(`/api/piece/${encodeURIComponent(pieceId)}/${action}`, { method: "POST", body: JSON.stringify(body) });
  } catch (err) {
    showError(err, pieceId);
    return null;
  }
  if (state.current && state.current.id === pieceId) {
    const id = action === "mark_add" ? res.mark && res.mark.id : body.id;
    const own = res.marks.find((m) => m.id === id);
    let marks = state.current.marks || [];
    if (action === "mark_delete") marks = marks.filter((m) => m.id !== id);
    else if (own) marks = marks.some((m) => m.id === id) ? marks.map((m) => (m.id === id ? own : m)) : marks.concat([own]);
    state.current = Object.assign({}, state.current, { marks });
    if (onDone) onDone(res.mark);
    renderMarks();
  }
  return res.mark;
}

let markSeq = 0;

function newMarkId() {
  return `m${Math.random().toString(16).slice(2, 10).padEnd(8, "0")}`;
}

function addMark(t) {
  if (!state.current) return Promise.resolve(null);
  const pieceId = state.current.id;
  const body = { t: Math.max(0, Math.min(state.current.length, Number(t) || 0)), id: newMarkId() };
  if (state.current.rev) body.rev = state.current.rev;
  const seq = ++markSeq;
  return finishMarkEdit(true).then(() =>
    markRequest(pieceId, "mark_add", body, (mark) => {
      if (seq === markSeq) state.markEdit = { id: mark.id, fresh: true, guitar: mark.guitar, text: mark.text };
    })
  );
}

async function finishMarkEdit(commit) {
  const ed = state.markEdit;
  if (!ed) return;
  const text = ed.input ? ed.input.value : ed.text;
  const mark = findMark(ed.id);
  state.markEdit = null;
  if (commit && mark && (ed.guitar !== mark.guitar || text !== mark.text)) {
    await markRequest(state.current.id, "mark_edit", { id: ed.id, guitar: ed.guitar, text });
  } else {
    renderMarks();
  }
}

function dropMark(id) {
  state.markEdit = null;
  return markRequest(state.current.id, "mark_delete", { id });
}

function cancelMarkEdit() {
  const ed = state.markEdit;
  if (!ed) return Promise.resolve();
  if (ed.fresh) return dropMark(ed.id);
  state.markEdit = null;
  renderMarks();
  return Promise.resolve();
}

function openMark(m) {
  const go = () => {
    const cur = findMark(m.id);
    if (!cur) return;
    const player = document.getElementById("player");
    state.auditionEnd = null;
    player.currentTime = cur.from_sec;
    state.markEdit = { id: cur.id, fresh: false, guitar: cur.guitar, text: cur.text };
    renderMarks();
  };
  if (!state.markEdit) {
    go();
    return Promise.resolve();
  }
  return finishMarkEdit(true).then(go);
}

function auditionMark(m) {
  if (m.can_audition === false) return;
  const player = document.getElementById("player");
  player.currentTime = m.from_sec;
  state.auditionEnd = m.to_sec;
  player.play().catch(() => {});
}

function timelineTime(blk, s, ev) {
  const r = blk.getBoundingClientRect ? blk.getBoundingClientRect() : null;
  if (!r || !r.width || !ev || typeof ev.clientX !== "number") return s.start_sec;
  const frac = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
  return s.start_sec + frac * (s.end_sec - s.start_sec);
}

function makeMarkEditor(m) {
  const ed = state.markEdit;
  const box = document.createElement("div");
  box.id = "markEditor";
  box.className = "mark-editor";
  box.dataset.markId = m.id;
  box.setAttribute("role", "group");
  box.setAttribute("aria-label", `Отметка ${m.bar}:${m.sixteenth}`);
  const guitars = [];
  for (const [val, txt] of MARK_GUITARS) {
    const b = document.createElement("button");
    b.dataset.markGuitar = val;
    b.textContent = txt;
    guitars.push([val, b]);
    b.onclick = () => {
      ed.guitar = val;
      for (const [v, other] of guitars) {
        other.className = v === val ? "active" : "";
        other.setAttribute("aria-pressed", v === val ? "true" : "false");
      }
    };
    box.appendChild(b);
  }
  for (const [v, b] of guitars) {
    b.className = v === ed.guitar ? "active" : "";
    b.setAttribute("aria-pressed", v === ed.guitar ? "true" : "false");
  }
  const input = document.createElement("input");
  input.id = "markText";
  input.type = "text";
  input.value = ed.text;
  input.setAttribute("maxlength", String(MARK_TEXT_MAX));
  input.setAttribute("aria-label", "Что не так");
  input.setAttribute("placeholder", "Что не так (необязательно)");
  ed.input = input;
  input.oninput = () => {
    ed.text = input.value;
  };
  input.onkeydown = (ev) => {
    if (ev.key === "Enter") finishMarkEdit(true);
  };
  const done = document.createElement("button");
  done.id = "markDone";
  done.className = "primary";
  done.textContent = "Готово";
  done.onclick = () => finishMarkEdit(true);
  const del = document.createElement("button");
  del.id = "markDelete";
  del.textContent = "Удалить";
  del.onclick = () => dropMark(m.id);
  box.appendChild(input);
  box.appendChild(done);
  box.appendChild(del);
  return box;
}

function renderMarks() {
  const d = state.current;
  const title = document.getElementById("marksTitle");
  if (!d || !title) return;
  const marks = d.marks || [];
  const total = Math.max(1, d.length);
  title.textContent = `Отметки (${marks.length})`;

  const track = document.getElementById("markTrack");
  track.innerHTML = "";
  const list = document.getElementById("markList");
  list.innerHTML = "";
  for (const m of marks) {
    const flag = document.createElement("button");
    flag.className = `mark-flag${m.stale ? " stale" : ""}`;
    flag.dataset.markId = m.id;
    flag.style.left = `${Number(((m.t / total) * 100).toFixed(2))}%`;
    flag.title = markSummary(m);
    flag.setAttribute("aria-label", `Отметка ${markSummary(m)}`);
    flag.onclick = () => openMark(m);
    track.appendChild(flag);

    const row = document.createElement("div");
    row.className = `mark-row${m.stale ? " stale" : ""}`;
    row.dataset.markId = m.id;
    const open = document.createElement("button");
    open.className = "mark-open";
    open.textContent = markSummary(m);
    open.onclick = () => openMark(m);
    const listen = document.createElement("button");
    listen.className = "mark-audition";
    listen.textContent = "Послушать место";
    listen.disabled = m.can_audition === false;
    listen.onclick = () => auditionMark(m);
    row.appendChild(open);
    row.appendChild(listen);
    list.appendChild(row);
  }

  const host = document.getElementById("markEditorHost");
  host.innerHTML = "";
  const editing = state.markEdit && findMark(state.markEdit.id);
  if (editing) host.appendChild(makeMarkEditor(editing));
  else state.markEdit = null;
}

function isTextTarget(t) {
  const tag = t && t.tagName ? String(t.tagName).toUpperCase() : "";
  if (tag === "INPUT") return TEXT_INPUT_TYPES.includes(String(t.type || "").toLowerCase());
  return tag === "TEXTAREA" || Boolean(t && t.isContentEditable);
}

document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") {
    if (state.markEdit) cancelMarkEdit();
    return;
  }
  if (ev.ctrlKey || ev.metaKey || ev.altKey || ev.repeat) return;
  if (ev.code !== "KeyM" && String(ev.key).toLowerCase() !== "m") return;
  if (isTextTarget(ev.target) || !state.current) return;
  ev.preventDefault();
  addMark(document.getElementById("player").currentTime);
});

  badge.title = "Сколько раз перегенерировали";

  badge.textContent = `#${l.salt}`;

  btn.appendChild(badge);
  btn.onclick = () => mutate(`/api/piece/${encodeURIComponent(pieceId)}/reroll`, { layer: l.layer, section: l.section }, pieceId, btn);

async function mutate(url, body, pieceId, ctl) {
  if (ctl) ctl.disabled = true;
  if (state.pendingSliders.length) await settlePending();
  const player = document.getElementById("player");
  const pos = player ? player.currentTime : null;
  const seq = ++state.editSeq;
  setChip(1);
  let det;
  try {
    det = await api(url, { method: "POST", body: JSON.stringify(body) });
  } catch (err) {
    showError(err, pieceId);
    if (state.currentId === pieceId && state.current) {
      let saved = null;
      try {
        saved = await api(`/api/piece/${encodeURIComponent(pieceId)}`);
      } catch (_) {}
      if (seq === state.editSeq && state.current.id === pieceId) {
        if (saved) state.current = saved;
        if (state.currentId === pieceId) renderWorkspace(pos);
      }
    }
    return;
  } finally {
    setChip(-1);
  }
  const fresh = () => seq === state.editSeq && state.currentId === pieceId;
  if (seq === state.editSeq && state.current && state.current.id === pieceId) state.current = det;
  if (fresh()) renderWorkspace(pos);
  try {
    await refreshList();
  } catch (err) {
    showError(err);
  }
}

async function refreshList() {
  const data = await api("/api/pieces");
  state.pieces = data.pieces || [];
  renderList();
}

async function selectPiece(id) {
  if (state.markEdit) await finishMarkEdit(true);
  const seq = ++state.navSeq;
  if (state.pendingSliders.length) await settlePending();
  if (seq !== state.navSeq) return;
  const edits = state.editSeq;
  state.currentId = id;
  let det;
  try {
    det = await api(`/api/piece/${encodeURIComponent(id)}`);
  } catch (err) {
    if (seq === state.navSeq) {
      state.currentId = state.current ? state.current.id : null;
      showError(err, id);
      renderList();
      renderWorkspace();
    }
    return;
  }
  if (seq !== state.navSeq) return;
  if (edits !== state.editSeq) {
    state.currentId = state.current ? state.current.id : null;
    renderList();
    renderWorkspace();
    return;
  }
  if (!state.current || state.current.id !== det.id) {
    state.error = "";
    state.markEdit = null;
  }
  state.current = det;
  renderList();
  renderWorkspace();
}

document.getElementById("newBtn").onclick = async () => {
  const raw = document.getElementById("seedInput").value.trim();
  const seed = raw === "" ? null : parseInt(raw, 10);
  if (state.markEdit) await finishMarkEdit(true);
  const seq = ++state.navSeq;
  if (state.pendingSliders.length) await settlePending();
  if (seq !== state.navSeq) return;
  let det;
  try {
    det = await api("/api/new", { method: "POST", body: JSON.stringify({ seed }) });
  } catch (err) {
    showError(err);
    return;
  }
  if (seq === state.navSeq) {
    state.error = "";
    state.markEdit = null;
    state.current = det;
    state.currentId = det.id;
    renderWorkspace();
  }
  try {
    await refreshList();
  } catch (err) {
    showError(err);
  }
};

paintError();
refreshList().then(() => {
  if (state.pieces.length > 0 && !state.current && !state.currentId) {
    selectPiece(state.pieces[0].id);
  }
});
</script>
</body>
</html>
